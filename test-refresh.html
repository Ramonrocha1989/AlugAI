<!DOCTYPE html>
<html>
<head>
    <title>Teste Refresh Token</title>
</head>
<body>
    <h1>Teste Refresh Token</h1>
    <button onclick="testRefresh()">Testar Refresh</button>
    <div id="result"></div>

    <script>
        async function testRefresh() {
            const result = document.getElementById('result');
            
            try {
                // 1. Verificar tokens iniciais
                const initialAccess = localStorage.getItem('accessToken');
                const initialRefresh = localStorage.getItem('refreshToken');
                
                result.innerHTML += `<p>Tokens iniciais:</p>`;
                result.innerHTML += `<p>Access: ${initialAccess?.substring(0, 20)}...</p>`;
                result.innerHTML += `<p>Refresh: ${initialRefresh?.substring(0, 20)}...</p>`;
                
                // 2. Simular token expirado
                localStorage.setItem('accessToken', 'fake_expired_token');
                result.innerHTML += `<p>✅ Token expirado simulado</p>`;
                
                // 3. Fazer requisição que vai triggerar refresh
                const response = await fetch('/api/machines');
                
                // 4. Verificar novos tokens
                const newAccess = localStorage.getItem('accessToken');
                const newRefresh = localStorage.getItem('refreshToken');
                
                result.innerHTML += `<p>Novos tokens:</p>`;
                result.innerHTML += `<p>Access: ${newAccess?.substring(0, 20)}...</p>`;
                result.innerHTML += `<p>Refresh: ${newRefresh?.substring(0, 20)}...</p>`;
                
                // 5. Verificar se mudaram
                if (newAccess !== initialAccess && newRefresh !== initialRefresh) {
                    result.innerHTML += `<p style="color: green">✅ SUCESSO: Ambos os tokens foram atualizados!</p>`;
                } else {
                    result.innerHTML += `<p style="color: red">❌ ERRO: Tokens não foram atualizados</p>`;
                }
                
            } catch (error) {
                result.innerHTML += `<p style="color: red">❌ ERRO: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
